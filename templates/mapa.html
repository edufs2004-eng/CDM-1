<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mapa Mundi - {{ jugador.nombre }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="contenedor-menu">
        <h1>MAPA MUNDI</h1>
        
        <p style="margin-bottom: 20px;">Selecciona una zona para explorar:</p>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <div class="opciones-juego">
            {% for zona in zonas %}
                <a href="/zona/{{ zona }}" class="btn btn-bloque">{{ zona }}</a>
            {% endfor %}
            <a href="/menu_juego" class="btn btn-bloque btn-secundario" style="margin-top: 20px;">Volver al Menú</a>
        </div>
    </div>
</body>
</html>
